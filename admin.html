<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SK Coaching Centre - Student Entries</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f3f7ff;
        color: #15213f;
      }
      .wrap {
        max-width: 1100px;
        margin: 40px auto;
        padding: 24px;
      }
      h1 {
        margin-bottom: 24px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      }
      th, td {
        padding: 14px 16px;
        border-bottom: 1px solid #e6ebf5;
        text-align: left;
      }
      th {
        background: #102d8d;
        color: #fff;
      }
      .status {
        margin-bottom: 18px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Student Entries</h1>
      <div class="status" id="status">Loading entries...</div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Class</th>
            <th>Phone</th>
            <th>Course</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="entriesBody"></tbody>
      </table>
    </div>

    <script>
      async function loadEntries() {
        const status = document.getElementById('status');
        const body = document.getElementById('entriesBody');

        try {
          const response = await fetch('/entries');
          const entries = await response.json();

          if (!Array.isArray(entries)) {
            throw new Error('No valid entries found');
          }

          if (entries.length === 0) {
            body.innerHTML = '<tr><td colspan="6">No student entries yet.</td></tr>';
            status.textContent = 'No entries found';
            return;
          }

          body.innerHTML = entries
            .map(
              (entry) => `
                <tr>
                  <td>${entry.id}</td>
                  <td>${entry.name}</td>
                  <td>${entry.class_name}</td>
                  <td>${entry.phone}</td>
                  <td>${entry.course}</td>
                  <td>${entry.created_at}</td>
                </tr>
              `
            )
            .join('');

          status.textContent = `${entries.length} student entry(s) loaded`;
        } catch (error) {
          status.textContent = 'Unable to load entries.';
          body.innerHTML = '<tr><td colspan="6">Error loading data.</td></tr>';
        }
      }

      loadEntries();
    </script>
  </body>
</html>
